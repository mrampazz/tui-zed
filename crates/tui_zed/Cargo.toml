[package]
name = "tui_zed"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "tui_zed.rs"

[[bin]]
name = "tui-zed"
path = "main.rs"

[dependencies]
# TUI framework
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Our crates
async_executor.workspace = true
text_style.workspace = true

# External
anyhow.workspace = true
log = "0.4"
